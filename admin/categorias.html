<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Categorias - Admin Ofertas do Rafa</title>
    <link rel="icon" type="image/png" href="../site/assets/images/logo/favicon.png">
    <link rel="apple-touch-icon" href="../site/assets/images/logo/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #1A5F5F;
            --secondary: #F5A623;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center hover:opacity-80">
                        <img src="../site/assets/images/logo/logo-full.png" alt="Ofertas do Rafa" class="h-16 w-auto max-w-sm">
                        <span class="ml-4 text-xl font-bold text-gray-800">Admin Panel</span>
                    </a>
                </div>
                <button id="logout-btn" class="text-gray-600 hover:text-red-600 font-medium">
                    🚪 Sair
                </button>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Breadcrumb -->
        <nav class="mb-6">
            <a href="index.html" class="text-[#1A5F5F] hover:underline">Dashboard</a>
            <span class="text-gray-500 mx-2">/</span>
            <span class="text-gray-700">Categorias</span>
        </nav>
        
        <!-- Add Category Card -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">➕ Adicionar Nova Categoria</h1>
            
            <form id="category-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- ID -->
                    <div>
                        <label for="category-id" class="block text-sm font-medium text-gray-700 mb-2">
                            🔑 ID da Categoria *
                        </label>
                        <input 
                            type="text" 
                            id="category-id" 
                            name="category-id"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent outline-none"
                            placeholder="ex: smartphones"
                            required
                            pattern="[a-z0-9-]+"
                        >
                        <p class="mt-1 text-sm text-gray-500">Apenas letras minúsculas, números e hífen</p>
                    </div>
                    
                    <!-- Nome -->
                    <div>
                        <label for="category-name" class="block text-sm font-medium text-gray-700 mb-2">
                            📝 Nome da Categoria *
                        </label>
                        <input 
                            type="text" 
                            id="category-name" 
                            name="category-name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent outline-none"
                            placeholder="ex: Smartphones"
                            required
                        >
                    </div>
                    
                    <!-- Ícone -->
                    <div>
                        <label for="category-icon" class="block text-sm font-medium text-gray-700 mb-2">
                            😀 Emoji/Ícone *
                        </label>
                        <input 
                            type="text" 
                            id="category-icon" 
                            name="category-icon"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent outline-none text-2xl"
                            placeholder="📱"
                            required
                            maxlength="2"
                        >
                        <p class="mt-1 text-sm text-gray-500">Um emoji que representa a categoria</p>
                    </div>
                    
                    <!-- Cor -->
                    <div>
                        <label for="category-color" class="block text-sm font-medium text-gray-700 mb-2">
                            🎨 Cor *
                        </label>
                        <div class="flex gap-2">
                            <input 
                                type="color" 
                                id="category-color" 
                                name="category-color"
                                class="h-12 w-20 border border-gray-300 rounded-lg cursor-pointer"
                                value="#1A5F5F"
                                required
                            >
                            <input 
                                type="text" 
                                id="category-color-hex" 
                                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent outline-none"
                                placeholder="#1A5F5F"
                                value="#1A5F5F"
                                pattern="^#[0-9A-Fa-f]{6}$"
                            >
                        </div>
                    </div>
                </div>
                
                <!-- Descrição -->
                <div>
                    <label for="category-description" class="block text-sm font-medium text-gray-700 mb-2">
                        📄 Descrição
                    </label>
                    <textarea 
                        id="category-description" 
                        name="category-description"
                        rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent outline-none"
                        placeholder="Breve descrição da categoria..."
                    ></textarea>
                </div>
                
                <!-- Buttons -->
                <div class="flex gap-4">
                    <button 
                        type="submit"
                        class="flex-1 bg-[#F5A623] hover:bg-[#E09619] text-white font-semibold py-3 px-6 rounded-lg transition duration-200"
                    >
                        ✅ Adicionar Categoria
                    </button>
                    <button 
                        type="button"
                        onclick="document.getElementById('category-form').reset()"
                        class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition"
                    >
                        Limpar
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Categories List -->
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-xl font-bold text-gray-900 mb-6">📂 Categorias Existentes</h2>
            
            <div id="categories-list" class="space-y-4">
                <!-- Categories will be loaded here -->
            </div>
            
            <div id="empty-categories" class="hidden text-center py-8 text-gray-500">
                Nenhuma categoria cadastrada ainda
            </div>
        </div>
        
        <!-- Success Message -->
        <div id="success-message" class="hidden fixed bottom-4 right-4 bg-green-500 text-white px-6 py-4 rounded-lg shadow-lg">
            ✅ Categoria salva com sucesso!
        </div>
        
        <!-- Error Message -->
        <div id="error-message" class="hidden fixed bottom-4 right-4 bg-red-500 text-white px-6 py-4 rounded-lg shadow-lg">
            ❌ Erro ao salvar categoria
        </div>
    </main>
    
    <script>
        // Verificar autenticação
        if (sessionStorage.getItem('admin_authenticated') !== 'true') {
            window.location.href = 'login.html';
        }
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_authenticated');
            sessionStorage.removeItem('admin_login_time');
            window.location.href = 'login.html';
        });
        
        // Sincronizar color picker com input hex
        const colorPicker = document.getElementById('category-color');
        const colorHex = document.getElementById('category-color-hex');
        
        colorPicker.addEventListener('input', (e) => {
            colorHex.value = e.target.value.toUpperCase();
        });
        
        colorHex.addEventListener('input', (e) => {
            const hex = e.target.value;
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                colorPicker.value = hex;
            }
        });
        
        // Carregar categorias existentes
        async function loadCategories() {
            try {
                const response = await fetch('../site/data/produtos.json');
                const data = await response.json();
                
                const categories = data.categorias || [];
                
                if (categories.length === 0) {
                    document.getElementById('empty-categories').classList.remove('hidden');
                    return;
                }
                
                const container = document.getElementById('categories-list');
                container.innerHTML = categories.map(cat => `
                    <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg hover:bg-gray-50">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl">${cat.icone}</div>
                            <div>
                                <h3 class="font-semibold text-gray-900">${cat.nome}</h3>
                                <p class="text-sm text-gray-500">ID: ${cat.id} ${cat.descricao ? '• ' + cat.descricao : ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="w-8 h-8 rounded" style="background-color: ${cat.cor}"></div>
                            <button 
                                onclick="deleteCategory('${cat.id}')"
                                class="text-red-600 hover:text-red-800 font-medium"
                            >
                                🗑️ Excluir
                            </button>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
            }
        }
        
        // Adicionar categoria
        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newCategory = {
                id: document.getElementById('category-id').value.toLowerCase().trim(),
                nome: document.getElementById('category-name').value.trim(),
                slug: document.getElementById('category-id').value.toLowerCase().trim(),
                icone: document.getElementById('category-icon').value.trim(),
                cor: document.getElementById('category-color').value.toUpperCase(),
                descricao: document.getElementById('category-description').value.trim()
            };
            
            try {
                // Chamar API para salvar
                const response = await fetch('http://localhost:5001/api/save-category', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(newCategory)
                });
                
                if (!response.ok) {
                    throw new Error('Erro ao salvar categoria');
                }
                
                // Mostrar mensagem de sucesso
                showMessage('success-message');
                
                // Limpar formulário
                document.getElementById('category-form').reset();
                document.getElementById('category-color').value = '#1A5F5F';
                document.getElementById('category-color-hex').value = '#1A5F5F';
                
                // Recarregar lista
                setTimeout(() => {
                    loadCategories();
                }, 500);
                
            } catch (error) {
                console.error('Erro:', error);
                showMessage('error-message');
            }
        });
        
        // Excluir categoria
        async function deleteCategory(categoryId) {
            if (!confirm(`Tem certeza que deseja excluir a categoria "${categoryId}"?`)) {
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5001/api/delete-category', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: categoryId })
                });
                
                if (!response.ok) {
                    throw new Error('Erro ao excluir categoria');
                }
                
                showMessage('success-message');
                loadCategories();
                
            } catch (error) {
                console.error('Erro:', error);
                showMessage('error-message');
            }
        }
        
        // Mostrar mensagem temporária
        function showMessage(elementId) {
            const element = document.getElementById(elementId);
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 3000);
        }
        
        // Carregar ao iniciar
        loadCategories();
    </script>
</body>
</html>
