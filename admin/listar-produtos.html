<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produtos - Admin</title>
    <link rel="icon" type="image/png" href="/site/assets/images/logo/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/admin/assets/js/admin-layout.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="admin-header"></div>
    <script>
        document.getElementById('admin-header').innerHTML = AdminLayout.createHeader('listar');
        AdminLayout.init('listar');
    </script>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-6">📋 Gerenciar Produtos</h1>

            <!-- Filtros -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Categoria</label>
                        <select id="filter-category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                        <select id="filter-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent">
                            <option value="all">Todos</option>
                            <option value="active">Ativos</option>
                            <option value="expired">Expirados</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Buscar</label>
                        <input type="text" id="search-input" placeholder="Buscar por título..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- Lista de Produtos -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-900">Produtos</h2>
                    <button id="remove-expired-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors">
                        🗑️ Remover Expirados
                    </button>
                </div>

                <div id="products-list" class="space-y-4">
                    <!-- Produtos serão carregados aqui -->
                </div>

                <div id="empty-state" class="hidden text-center py-12">
                    <p class="text-gray-500 text-lg">Nenhum produto encontrado</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Edição de Preço -->
    <div id="edit-price-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold text-gray-900 mb-4">✏️ Editar Preço</h3>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Produto</label>
                <p id="edit-product-title" class="text-gray-900 font-medium"></p>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Preço Original (Amazon)</label>
                <input type="number" id="edit-price-original" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent" readonly>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">💰 Novo Preço Promocional</label>
                <input type="number" id="edit-price-new" step="0.01" placeholder="Ex: 89.90" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent">
                <p class="text-sm text-gray-500 mt-1">Deixe vazio para usar o preço da Amazon</p>
            </div>
            
            <div id="discount-preview" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-sm font-medium text-green-800">
                    🎉 Desconto: <span id="discount-value"></span>
                </p>
            </div>
            
            <div class="flex gap-3">
                <button id="cancel-edit-btn" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button id="save-price-btn" class="flex-1 px-4 py-2 bg-[#1A5F5F] text-white rounded-lg hover:bg-[#0D4444] transition-colors">
                    💾 Salvar
                </button>
            </div>
        </div>
    </div>

    <div id="admin-footer"></div>
    <script>
        document.getElementById('admin-footer').innerHTML = AdminLayout.createFooter();
    </script>
    
    <script src="/admin/assets/js/listar-produtos.js"></script>
</body>
</html>
