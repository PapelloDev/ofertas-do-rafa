<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Admin</title>
    <link rel="icon" type="image/png" href="/site/assets/images/logo/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/admin/assets/js/admin-layout.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="admin-header"></div>
    <script>
        document.getElementById('admin-header').innerHTML = AdminLayout.createHeader('configuracoes');
        AdminLayout.init('configuracoes');
    </script>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-6">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-6">⚙️ Configurações</h1>

            <!-- Configurações do Site -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-900 mb-4">🌐 Site</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Nome do Site
                    </label>
                    <input 
                        type="text" 
                        id="site-name" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent"
                    >
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Slogan
                    </label>
                    <input 
                        type="text" 
                        id="site-slogan" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent"
                    >
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        URL do Site
                    </label>
                    <input 
                        type="url" 
                        id="site-url" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent"
                    >
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Tag de Afiliado Amazon
                    </label>
                    <input 
                        type="text" 
                        id="partner-tag" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent"
                    >
                </div>
            </div>

            <!-- WhatsApp -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-900 mb-4">💬 Grupo WhatsApp</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        🔗 Link do Grupo WhatsApp
                    </label>
                    <input 
                        type="url" 
                        id="whatsapp-group-url" 
                        placeholder="https://chat.whatsapp.com/..." 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1A5F5F] focus:border-transparent"
                    >
                    <p class="text-sm text-gray-500 mt-1">
                        Link de convite para o grupo onde as ofertas são compartilhadas.
                    </p>
                </div>
            </div>

            <!-- Botão Salvar -->
            <div class="flex gap-3">
                <button 
                    id="save-config-btn" 
                    class="flex-1 bg-[#1A5F5F] hover:bg-[#0D4444] text-white px-6 py-3 rounded-lg font-semibold transition-colors"
                >
                    💾 Salvar Configurações
                </button>
            </div>
        </div>
    </main>

    <div id="admin-footer"></div>
    <script>
        document.getElementById('admin-footer').innerHTML = AdminLayout.createFooter();
    </script>
    
    <script src="/admin/assets/js/configuracoes.js"></script>
</body>
</html>
